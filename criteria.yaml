# What to search for and what counts as a match. Edit freely.
queries:
  - male fawn pug for sale
  - fawn male pug for adoption
  - adult male pug for sale
  - 1 year old male pug for sale
  - 2 year old male pug for sale
  - 3 year old male pug for sale
  - young adult male pug for sale
  - pug rescue adopt male
  - male pug for rehoming
  - apricot male pug for sale
  - fawn pug adult for adoption
  - pug dog for adoption male fawn
  - retired male pug for sale
  - pug adoption male 2 years
  - adopt a pug male near me
results_per_query: 30
max_pages: 100             # max result pages to scrape per run

min_age_years: 1
max_age_years: 3
genders: [male]
colors: [fawn, apricot]
exclude_colors: [black, brindle, silver, gray, grey, chocolate, merle]
max_fee: null              # e.g. 2000; null = no limit
allow_unknown: false
require_complete: true     # only pages for ONE specific male pug with age and color stated
require_price: false       # true = also drop listings with no price shown
max_prices_on_page: 2      # more prices than this = page lists several dogs
max_ages_on_page: 2        # more ages than this = page lists several dogs

listing_keywords: [for sale, adopt, available, rehome, rehoming, price, fee]
exclude_keywords: [shipping only, gift card, zelle only, wire transfer, western union,
                   special needs, medical needs, hospice, heartworm positive, needs surgery]
blocked_domains: [facebook.com, craigslist.org, pinterest., youtube.com, wikipedia.org,
                  reddit.com, instagram.com, tiktok.com, amazon.com, ebay.com, etsy.com]
