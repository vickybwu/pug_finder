# Edit these to change what counts as a match
location: null            # null = search all of the US; or a ZIP / "City, ST" to search nearby
distance_miles: null      # only used if location is set (Petfinder max 500)
countries: [US]           # Petfinder also has Canada; keep US only
max_fee: null             # null = no price limit
ages: [young]             # Petfinder "young" = roughly 1-3 years
genders: [male]
colors: [fawn, apricot]   # light coats only
exclude_colors: [black, dark, brindle, silver, gray, grey]
healthy_only: true        # drop listings marked special needs or not up to date on shots
must_be_good_with_children: false
exclude_keywords: [shipping only, gift card, zelle only, wire transfer, special needs, medical needs, hospice, heartworm positive, needs surgery]
